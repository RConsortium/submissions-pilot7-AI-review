protocol:
  objectives: Evaluate the efficacy and safety of transdermal xanomeline (50 cm2 and 75 cm2 patches) against placebo
    in mild to moderate Alzheimer's disease.
  design: Prospective, randomized, multi-center, double-blind, placebo-controlled, parallel-group study; subjects
    randomized equally to placebo, xanomeline low dose or high dose, applied two patches daily, and were followed
    for 26 weeks.
  plannedSubjects: 300 (100 per arm)
  provenance:
    kind: authored
    by: study team
estimands:
- id: EST:ADASCOG.WK24
  endpoint:
    label: ADAS-Cog (11) total, change from baseline to Week 24
    level: primary
  population: Efficacy population (EFFFL = 'Y' and ITTFL = 'Y')
  variable: Change from baseline in ADAS-Cog (11) total at Week 24
  treatments:
  - Placebo
  - Xanomeline Low Dose
  - Xanomeline High Dose
  intercurrentEvents:
  - event: Missing Week 24 assessment (e.g. early discontinuation)
    strategy: LOCF
    implementedBy:
    - VAR:ADADAS.DTYPE
  - event: Missing ADAS-Cog items at a visit
    strategy: Total adjusted for missing items (SAP §14.2)
    implementedBy:
    - PARAM:ADADAS.ACTOT
  summaryMeasure: Difference in LS means (ANCOVA with site group, baseline)
  prespecification:
    status: claimed
    evidence: null
- id: EST:GLUC.WK20
  endpoint:
    label: Glucose, change from baseline to Week 20
    level: safety
  population: Intent-to-treat
  variable: Change from baseline in glucose (mmol/L) at Week 20
  treatments:
  - Placebo
  - Xanomeline High Dose
  summaryMeasure: Difference in LS means (ANCOVA with baseline)
- id: EST:TTDE
  endpoint:
    label: Time to first dermatologic adverse event
    level: safety
  population: Safety population
  variable: Days to first treatment-emergent dermatologic AE
  treatments:
  - Placebo
  - Xanomeline Low Dose
  - Xanomeline High Dose
  summaryMeasure: Kaplan-Meier estimates; numbers at risk
analysisConsiderations:
  coreVariables:
  - VAR:ADSL.STUDYID
  - VAR:ADSL.USUBJID
  - VAR:ADSL.SITEGR1
  - VAR:ADSL.TRT01P
  - VAR:ADSL.SAFFL
  - VAR:ADSL.ITTFL
  - VAR:ADSL.EFFFL
  qa:
  - id: QA:ARM-TRT01P
    section: '3.2'
    question: Are values of ARM equivalent in meaning to TRT01P?
    answer: Yes.
    about:
    - VAR:ADSL.TRT01P
    provenance:
      kind: authored
      by: study team
  - id: QA:ACTARM
    section: '3.2'
    question: If TRT01A is used, are values of ACTARM equivalent to TRT01A?
    answer: Not applicable; ACTARM is not used.
    about:
    - VAR:ADSL.TRT01A
    provenance:
      kind: authored
      by: study team
  - id: QA:PLANNED-ACTUAL
    section: '3.2'
    question: Are both planned and actual treatment variables used in analysis?
    answer: Yes. Planned treatment for population and efficacy analyses, actual for safety. All subjects received
      their randomized arm, so planned equals actual.
    about:
    - VAR:ADSL.TRT01P
    - VAR:ADSL.TRT01A
    provenance:
      kind: authored
      by: study team
  - id: QA:GROUPING
    section: '3.2'
    question: Are treatment grouping variables used in analysis?
    answer: Not applicable.
    about:
    - VAR:ADSL.TRT01P
    provenance:
      kind: authored
      by: study team
  - id: QA:WINDOWING
    section: '3.3'
    question: Was windowing used in one or more analysis datasets?
    answer: Yes (ADADAS; see note on analysis visits).
    about:
    - VAR:ADADAS.AVISIT
    provenance:
      kind: authored
      by: study team
  - id: QA:UNSCHEDULED
    section: '3.3'
    question: Were unscheduled visits used in any analyses?
    answer: Yes.
    about:
    - VAR:ADADAS.AVISIT
    provenance:
      kind: authored
      by: study team
